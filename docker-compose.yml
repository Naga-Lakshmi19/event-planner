
version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:80"
    depends_on:
      - mongodb
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mongodb
      # Prefer a single connection string if your app supports it:
      MONGODB_URI: mongodb://mongodb:27017/event_manager
      # Optional discrete settings (some apps still read these):
      DB_HOST: mongodb
      DB_PORT: 27017

      # Pass APP_KEY from your host machine (ensure it's set in your shell or .env)
      APP_KEY: ${APP_KEY}

    command: >-
      bash -lc "
      mkdir -p storage/framework/{sessions,cache,views} bootstrap/cache &&
      chown -R www-data:www-data storage bootstrap/cache &&
      php artisan optimize:clear &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache || echo 'Skipping view cache...' &&
      php artisan migrate --force &&
      php artisan db:seed --force &&
      apache2-foreground
      "

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Use CMD-SHELL so pipes/eval work properly
      test: >
        CMD-SHELL
        mongosh --quiet --eval "db.adminCommand({ ping: 1 })" "mongodb://localhost:27017/admin"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
